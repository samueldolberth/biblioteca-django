<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastrar Avaliação</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <style>
    .navbar-custom {
      background-color: #0dcaf0;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.15);
    }
    .navbar-brand {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      font-weight: bold;
      font-size: 1.25rem;
      color: #fff !important;
    }
    .form-container {
      max-width: 600px;
      margin: 60px auto;
      background: #fff;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }
  </style>
</head>

<body>
  <!-- Navbar -->
  <header>
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom">
      <div class="container-fluid position-relative">
        <a class="navbar-brand" href="{% url 'index' %}">
          SGBooks - Sistema de Gerenciamento de Livros
        </a>
        <ul class="navbar-nav ms-auto d-flex flex-row gap-3 me-3">
          <li class="nav-item"><a class="nav-link" href="{% url 'index' %}">Início</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'cadastro_livro' %}">Livros</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Autores</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'avaliacoes' %}">Avaliações</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'logout' %}">Sair</a></li>
        </ul>
      </div>
    </nav>
  </header>

  <!-- Formulário -->
  <div class="container">
    <div class="form-container">
      <h3 class="text-center mb-4">Salvar Nova Avaliação</h3>

      <form method="POST">
        {% csrf_token %}
        
        <!-- Selecionar Livro -->
        <div class="mb-3">
          <label for="livro" class="form-label">Livro</label>
          <select name="livro_id" id="livro" class="form-select" required>
            <option value="" disabled selected>Selecione um livro</option>
            {% for livro in livros %}
              <option value="{{ livro.id }}">{{ livro.titulo }}</option>
            {% endfor %}
          </select>
        </div>

        <!-- Comentário -->
        <div class="mb-3">
          <label for="comentario" class="form-label">Comentário</label>
          <textarea name="comentario" id="comentario" rows="4" class="form-control" required></textarea>
        </div>

        <!-- Nota -->
        <div class="mb-3">
          <label for="nota" class="form-label">Nota (1 a 5)</label>
          <input type="number" name="nota" id="nota" class="form-control" min="1" max="5" required>
        </div>

        <div class="d-flex justify-content-between">
          <a href="{% url 'avaliacoes' %}" class="btn btn-secondary btn-sm">Voltar</a>
          <button type="submit" class="btn btn-primary btn-sm">Salvar Avaliação</button>
        </div>
      </form>
    </div>
  </div>

</body>
</html>
