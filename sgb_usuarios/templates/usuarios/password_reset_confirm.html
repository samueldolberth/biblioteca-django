{% extends 'base.html' %}
{% block content %}
<div class="container mt-5" style="max-width: 400px;">
  <h3 class="mb-3 text-center">Digite sua nova senha</h3>

  {% if validlink %}
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-success w-100">Salvar nova senha</button>
    </form>
  {% else %}
    <p class="text-danger text-center">Esse link é inválido ou já foi usado.</p>
  {% endif %}
</div>
{% endblock %}
